<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>PEPEVOLT • Professional UI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top,#1d2b64 0%,#0b1020 40%,#050816 100%);
    color:#fff;
}

/* BACKGROUND EFFECTS */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,170,0.12), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(0,180,255,0.14), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(138,43,226,0.12), transparent 30%);
    z-index:0;
}

/* MAIN CONTAINER */
.game-container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px;
    gap:16px;
}

/* TOP HEADER */
.top-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand-title{
    font-family:'Orbitron',sans-serif;
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:1px;
}

.brand-sub{
    font-size:0.78rem;
    color:rgba(255,255,255,0.65);
}

.wallet-status{
    padding:10px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    font-size:0.82rem;
    font-weight:600;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:16px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 10px 30px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

.stat-icon{
    font-size:1.5rem;
    margin-bottom:8px;
}

.stat-value{
    font-size:1.1rem;
    font-weight:700;
}

.stat-label{
    margin-top:4px;
    font-size:0.72rem;
    color:rgba(255,255,255,0.65);
}

/* CENTER AREA */
.interaction-area{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
}

/* TAP BUTTON */
.tap-wrapper{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tap-wrapper::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:rgba(0,255,170,0.12);
    filter:blur(25px);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{ transform:scale(0.9); opacity:0.5; }
    50%{ transform:scale(1.05); opacity:1; }
    100%{ transform:scale(0.9); opacity:0.5; }
}

.tap-circle{
    position:relative;
    width:190px;
    height:190px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-family:'Orbitron',sans-serif;
    font-size:2rem;
    font-weight:800;
    color:#04131a;

    background:
        linear-gradient(145deg,#00ffa3,#00c2ff);

    box-shadow:
        0 15px 40px rgba(0,255,170,0.25),
        inset 0 3px 10px rgba(255,255,255,0.4);

    transition:
        transform .08s ease,
        box-shadow .2s ease;
}

.tap-circle:active{
    transform:scale(0.94);
}

.tap-circle.disconnected{
    background:linear-gradient(145deg,#5e6472,#424854);
    color:#c7c7c7;
    box-shadow:none;
}

/* ENERGY */
.energy-section{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.energy-top{
    display:flex;
    justify-content:space-between;
    font-size:0.82rem;
    color:rgba(255,255,255,0.75);
}

.energy-bar{
    width:100%;
    height:16px;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.06);
}

.energy-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:
        linear-gradient(90deg,#00ffa3,#00d9ff);
    transition:width .4s ease;
}

/* BUTTONS */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.game-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:16px;
    font-size:0.95rem;
    font-weight:700;
    color:#fff;
    cursor:pointer;

    background:
        linear-gradient(135deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.06));

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(12px);

    transition:
        transform .15s ease,
        opacity .2s ease;
}

.game-btn:active{
    transform:scale(0.98);
}

.btn-wallet{
    background:
        linear-gradient(135deg,#3b82f6,#2563eb);
}

.btn-buy{
    background:
        linear-gradient(135deg,#00c853,#00e676);
    color:#001b0d;
}

.btn-convert{
    background:
        linear-gradient(135deg,#8b5cf6,#6d28d9);
}

.btn-claim{
    background:
        linear-gradient(135deg,#ff9800,#ff5722);
}

button:disabled{
    opacity:0.45;
    filter:grayscale(1);
    cursor:not-allowed;
}

/* FOOTER */
.footer{
    text-align:center;
    font-size:0.72rem;
    color:rgba(255,255,255,0.45);
    padding-bottom:6px;
}
</style>
</head>

<body>

<div class="game-container">

    <!-- HEADER -->
    <div class="top-header">
        <div class="brand">
            <div class="brand-title">PEPEVOLT</div>
            <div class="brand-sub">Polygon Tap Ecosystem</div>
        </div>

        <div class="wallet-status" id="wallet-status">
            Wallet Offline
        </div>
    </div>

    <!-- STATS -->
    <header class="stats">

        <div class="stat-card">
            <div class="stat-icon">⚡</div>
            <div class="stat-value" id="energy-display">0</div>
            <div class="stat-label">ENERGY</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">💎</div>
            <div class="stat-value" id="points-display">0</div>
            <div class="stat-label">POINTS</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">🪙</div>
            <div class="stat-value" id="burned-display">0.00</div>
            <div class="stat-label">gPVLT</div>
        </div>

    </header>

    <!-- MAIN -->
    <main class="interaction-area">

        <div class="tap-wrapper">
            <button id="tap-button" class="tap-circle disconnected" disabled>
                TAP
            </button>
        </div>

        <!-- ENERGY -->
        <div class="energy-section">

            <div class="energy-top">
                <span>ENERGY LEVEL</span>
                <span id="energy-percent">0%</span>
            </div>

            <div class="energy-bar">
                <div id="energy-fill" class="energy-fill"></div>
            </div>

        </div>

        <!-- BUTTONS -->
        <div class="buttons">

            <button id="wallet-btn" class="game-btn btn-wallet" onclick="toggleWallet()">
                Connect Wallet
            </button>

            <button id="buy-btn" class="game-btn btn-buy" onclick="confirmRefill()" disabled>
                Buy 10,000 Energy • 100 PVLT
            </button>

            <button id="convert-btn" class="game-btn btn-convert" onclick="convertPVLT()" disabled>
                Convert Points
            </button>

            <button id="claim-btn" class="game-btn btn-claim" onclick="claimPVLT()" disabled>
                Claim Rewards
            </button>

        </div>

    </main>

    <div class="footer">
        Powered by Polygon • Secure Web3 Gaming
    </div>

</div>

<script>
let energy = 0,
    points = 500,
    pvlt = 200,
    burnedGpvlt = 0;

let isWalletConnected = false,
    isPaidUser = false,
    lastClaimDate = null;

const FREE_CAP = 50,
      PAID_CAP = 10000;

function updateUI() {

    const cap = isPaidUser ? PAID_CAP : FREE_CAP;

    document.getElementById('energy-display').innerText = energy;

    if (!isWalletConnected) {

        document.getElementById('points-display').innerText = "0";
        document.getElementById('burned-display').innerText = "0.00";

    } else {

        document.getElementById('points-display').innerText = points;
        document.getElementById('burned-display').innerText = burnedGpvlt.toFixed(2);

        const percentage = (energy / cap * 100);

        document.getElementById('energy-fill').style.width = percentage + "%";
        document.getElementById('energy-percent').innerText =
            Math.floor(percentage) + "%";
    }
}

function toggleWallet() {

    isWalletConnected = !isWalletConnected;

    document.getElementById('wallet-btn').innerText =
        isWalletConnected ? "Disconnect Wallet" : "Connect Wallet";

    document.getElementById('wallet-status').innerText =
        isWalletConnected ? "Wallet Connected" : "Wallet Offline";

    document.getElementById('tap-button').disabled = !isWalletConnected;

    document.getElementById('buy-btn').disabled = !isWalletConnected;
    document.getElementById('convert-btn').disabled = !isWalletConnected;
    document.getElementById('claim-btn').disabled = !isWalletConnected;

    document.getElementById('tap-button').classList.toggle(
        'disconnected',
        !isWalletConnected
    );

    updateUI();
}

function confirmRefill() {

    if (pvlt >= 100) {

        const btn = document.getElementById('buy-btn');

        btn.innerText = "Processing Polygon...";
        btn.disabled = true;

        setTimeout(() => {

            pvlt -= 100;
            isPaidUser = true;
            energy = PAID_CAP;

            btn.innerText = "Buy 10,000 Energy • 100 PVLT";
            btn.disabled = false;

            updateUI();

            alert("Transaction Confirmed on Polygon! Energy refilled to 10,000.");

        }, 2000);

    } else {

        alert("Insufficient PVLT balance on Polygon network!");

    }
}

function convertPVLT() {

    if (points >= 100) {

        const btn = document.getElementById('convert-btn');

        btn.innerText = "Processing...";
        btn.disabled = true;

        setTimeout(() => {

            points -= 100;
            burnedGpvlt += 1;

            btn.innerText = "Convert Points";
            btn.disabled = false;

            updateUI();

            alert("Points converted successfully on Polygon!");

        }, 1500);

    } else {

        alert("Need 100 💎");

    }
}

function claimPVLT() {

    const today = new Date().toDateString();

    if (lastClaimDate === today) {

        alert("Already claimed today!");
        return;
    }

    if (burnedGpvlt >= 100 && burnedGpvlt <= 1000) {

        const btn = document.getElementById('claim-btn');

        btn.innerText = "Claiming on Polygon...";
        btn.disabled = true;

        setTimeout(() => {

            let reward = Math.floor(burnedGpvlt / 100);

            alert(`Success! Transferring ${reward} PVLT to your connected wallet.`);

            burnedGpvlt = 0;
            lastClaimDate = today;

            btn.innerText = "Claim Rewards";
            btn.disabled = false;

            updateUI();

        }, 2000);

    } else {

        alert("You need between 100 and 1000 gPVLT to claim.");

    }
}

document.getElementById('tap-button').addEventListener('click', () => {

    if (energy > 0) {

        energy--;
        points++;

        updateUI();
    }
});

setInterval(() => {

    const cap = isPaidUser ? PAID_CAP : FREE_CAP;

    if (isWalletConnected && energy < cap) {

        energy++;
        updateUI();
    }

}, 1000);

updateUI();
</script>

</body>
</html>
